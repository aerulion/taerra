# Every image generate.py renders, written to images/<file>. Add an entry for each site and size you need: every
# layout scales to any size and aspect ratio.
#
# Layouts (defined in render.html):
#   icon                the mark over the blurred world, for square avatars
#   banner              lockup and tagline on the left, the whole world on the right, for wide headers
#   card                lockup and tagline centred, for link previews
#   live-map            lockup over drawn cubes, no world: the web map's preview, the same on every server
#   featured            lockup, tagline and the whole world at gallery proportions: the featured gallery image
#   section             a slim strip heading one section of a description, with these options:
#                         title = "Features"   the heading
#                         spot = "meadow"      where it looks: meadow, wide, bay, top-down, peaks, cherry, nether, end
#   gallery-isometric   the whole overworld
#   gallery-detail      a close-up at full detail
#   gallery-top-down    the top-down map
#   gallery-rotations   the overworld from all four sides
#   gallery-dimensions  overworld, nether and end side by side

