name: 💬 Notify Discord

on:
  workflow_call:
    inputs:
      title:
        description: The embed title.
        required: true
        type: string
      description:
        description: >-
          The embed text, Markdown. Headings become bold lines, since embeds do not render them, and a text past
          Discord's 4096 characters is split over several messages.
        required: true
        type: string
      url:
        description: Where the title links to.
        required: false
        type: string
      icon:
        description: URL of the avatar and thumbnail image. Left out, Discord shows its default avatar.
        required: false
        type: string
      username:
        description: The name the message is posted under.
        required: false
        type: string
        default: TAERRA
    secrets:
      WEBHOOK_ID:
        description: The webhook ID.
        required: true
      WEBHOOK_TOKEN:
        description: The webhook token.
        required: true

permissions:
  contents: read

jobs:
  notify:
    name: 💬 Post to the webhook
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: 💬 Post to the webhook
        env:
          WEBHOOK_ID: ${{ secrets.WEBHOOK_ID }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          USERNAME: ${{ inputs.username }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
          URL: ${{ inputs.url }}
          ICON: ${{ inputs.icon }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_ID}" ] || [ -z "${WEBHOOK_TOKEN}" ]; then
            echo "::error::The webhook ID and token must both be set."
            exit 1
          fi

          DESCRIPTION="$(sed -E 's/^#{1,6}[[:space:]]+(.*)$/**\1**/' <<< "${DESCRIPTION}")"

          # Embeds hold 4096 characters, so a longer text goes out in several messages, split between lines.
          limit=4000
          chunks=()
          chunk=''
          while IFS= read -r line; do
            line="${line:0:${limit}}"
            if [ -n "${chunk}" ] && [ $((${#chunk} + 1 + ${#line})) -gt "${limit}" ]; then
              chunks+=("${chunk}")
              chunk="${line}"
            else
              chunk="${chunk:+${chunk}$'\n'}${line}"
            fi
          done <<< "${DESCRIPTION}"
          chunks+=("${chunk}")

          first=true
          for chunk in "${chunks[@]}"; do
            if [ "${first}" = 'false' ]; then
              sleep 1
            fi
            # allowed_mentions stops an @everyone in a commit subject from pinging the whole server.
            payload="$(jq -nc --arg username "${USERNAME}" --arg icon "${ICON}" --arg title "${TITLE}" \
              --arg description "${chunk}" --arg url "${URL}" --argjson first "${first}" '{
                username: $username,
                allowed_mentions: {parse: []},
                embeds: [{description: $description, color: 5416245}
                  + (if $first then {title: $title[0:256]} else {} end)
                  + (if $first and $url != "" then {url: $url} else {} end)
                  + (if $first and $icon != "" then {thumbnail: {url: $icon}} else {} end)]
              } + (if $icon == "" then {} else {avatar_url: $icon} end)')"

            curl --silent --show-error --fail-with-body \
              --retry 3 --retry-connrefused --max-time 30 \
              --header 'Content-Type: application/json' \
              --user-agent 'Taerra-Release-Pipeline' \
              --data "${payload}" \
              "https://discord.com/api/webhooks/${WEBHOOK_ID}/${WEBHOOK_TOKEN}"
            first=false
          done

          echo "Notification sent as ${#chunks[@]} message(s)."
