org.gradle.console=plain
org.gradle.caching=true
org.gradle.parallel=true

# The build scripts are written for this - keep new tasks off script-level state in their execution blocks.
org.gradle.configuration-cache=true

# The default 512m daemon heap is not enough for paperweight's userdev and loom's Minecraft setup together.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Duser.language=en
