name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release every stream, even one with nothing new since its last release.
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    name: 🔍 Detect changed parts
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.detect.outputs.plugin }}
      mod: ${{ steps.detect.outputs.mod }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 🔍 Classify the changed files
        id: detect
        uses: ./.github/actions/classify-changes
        with:
          base: ${{ github.event.before }}
          release-tags: 'true'
          force: ${{ inputs.force || 'false' }}

  build:
    name: 🛡️ Validation
    needs: changes
    if: needs.changes.outputs.any == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      build-number: ${{ github.run_number }}
      publish: ${{ needs.changes.outputs.plugin == 'true' }}
      upload-jars: true

  release-plugin:
    name: 📦 Release plugin
    timeout-minutes: 15
    needs: [ changes, build ]
    if: needs.changes.outputs.plugin == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: ⬇️ Download the built jars
        uses: actions/download-artifact@v8
        with:
          name: plugin-jars
          path: ./generated/

      - name: 📦 Create GitHub release
        uses: ./.github/actions/github-release
        with:
          tag: build-${{ github.run_number }}
          prefix: build-
          title: build-${{ github.run_number }} (${{ needs.build.outputs.version }})
          files: |
            ./generated/plugin/build/libs/*.jar
            ./generated/api/build/libs/*.jar

  release-mod:
    name: 🗺️ Release mod
    timeout-minutes: 15
    needs: [ changes, build ]
    if: needs.changes.outputs.mod == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: ⬇️ Download the built jar
        uses: actions/download-artifact@v8
        with:
          name: mod-jars
          path: ./generated/

      - name: 📦 Create GitHub release
        uses: ./.github/actions/github-release
        with:
          tag: mod-${{ github.run_number }}
          prefix: mod-
          title: mod-${{ github.run_number }} (${{ needs.build.outputs.version }})
          files: ./generated/*.jar

  cleanup-packages:
    name: 🧹 Cleanup old packages
    needs: release-plugin
    uses: ./.github/workflows/cleanup-packages.yml
    with:
      keep-latest: 10
      package-name: net.aerulion.taerra-api
    permissions:
      packages: write

  cleanup-plugin-releases:
    name: 🧹 Cleanup old plugin releases
    needs: release-plugin
    uses: ./.github/workflows/cleanup-releases.yml
    with:
      keep-latest: 10
      tag-prefix: build-
    permissions:
      contents: write

  cleanup-mod-releases:
    name: 🧹 Cleanup old mod releases
    needs: release-mod
    uses: ./.github/workflows/cleanup-releases.yml
    with:
      keep-latest: 10
      tag-prefix: mod-
    permissions:
      contents: write
