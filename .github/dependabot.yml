version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    commit-message:
      prefix: ":arrow_up: deps:"
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    commit-message:
      prefix: ":arrow_up: deps:"
    labels:
      - dependencies
      - gradle
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /tools/mcdata
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    commit-message:
      prefix: ":arrow_up: deps:"
    labels:
      - dependencies
      - python
    open-pull-requests-limit: 5

  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    commit-message:
      prefix: ":arrow_up: deps:"
    labels:
      - dependencies
      - website
    open-pull-requests-limit: 5
