name: ✅ Pull Request

on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled, edited ]

permissions:
  contents: read

concurrency:
  group: >-
    pr-${{ github.event.pull_request.number }}${{ (github.event.action == 'edited'
    || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'deploy'))
    && '-meta' || '' }}
  cancel-in-progress: >-
    ${{ github.event.action != 'edited'
    && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'deploy') }}

env:
  API_COORDINATES: net.aerulion:taerra-api

jobs:
  changes:
    name: 🔍 Detect changed parts
    timeout-minutes: 10
    if: >-
      github.event.action != 'edited'
      && ((github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'deploy')
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.detect.outputs.plugin }}
      mod: ${{ steps.detect.outputs.mod }}
      site: ${{ steps.detect.outputs.site }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🔍 Classify the changed files
        id: detect
        uses: ./.github/actions/classify-changes
        with:
          base: ${{ github.event.pull_request.base.sha }}

  commit-messages:
    name: 📝 Check commit messages
    timeout-minutes: 10
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 📝 Check every commit message
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          message="$(mktemp)"
          failed=0
          checked=0
          while IFS=$'\t' read -r sha author; do
            if [ -z "${sha}" ] || [ "${author}" = 'dependabot[bot]' ]; then
              continue
            fi
            checked=$((checked + 1))
            git log -1 --format=%B "${sha}" > "${message}"
            if ! ./.githooks/commit-msg "${message}"; then
              echo "::error::${sha} has a malformed commit message."
              failed=$((failed + 1))
            fi
          done < <(git log --no-merges --format='%H%x09%an' "${BASE}..HEAD")
          echo "Checked ${checked} commit messages, ${failed} malformed."
          if [ "${failed}" -gt 0 ]; then
            exit 1
          fi

      - name: 📝 Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          message="$(mktemp)"
          printf '%s\n' "${TITLE}" > "${message}"
          if ! ./.githooks/commit-msg "${message}"; then
            echo "::error::The pull request title is malformed, and a squash merge would land it as the commit subject."
            exit 1
          fi

  scripts:
    name: 🧪 Test workflow scripts
    timeout-minutes: 5
    if: >-
      github.event.action != 'edited'
      && ((github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 🧪 Run the tests
        run: node --test .github/scripts/*.test.mjs

  build:
    name: 🛡️ Validation
    needs: changes
    if: needs.changes.outputs.plugin == 'true' || needs.changes.outputs.mod == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      build-number: ${{ github.run_number }}
      pr-number: ${{ github.event.pull_request.number }}
      publish: >-
        ${{ needs.changes.outputs.plugin == 'true'
        && contains(github.event.pull_request.labels.*.name, 'deploy') }}
      upload-jars: ${{ contains(github.event.pull_request.labels.*.name, 'deploy') }}

  site:
    name: 🌐 Website
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: 🏗️ Check and build the website
        uses: ./.github/actions/build-site

  comment:
    name: 💬 Update PR comment
    timeout-minutes: 5
    needs: [ changes, build ]
    if: >-
      always() && needs.changes.result == 'success'
      && (needs.changes.outputs.plugin == 'true' || needs.changes.outputs.mod == 'true')
      && contains(github.event.pull_request.labels.*.name, 'deploy')
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: 💬 Write deployment comment
        uses: actions/github-script@v9
        env:
          API_PUBLISHED: ${{ needs.build.outputs.published }}
          BUILD_RESULT: ${{ needs.build.result }}
          VERSION: ${{ needs.build.outputs.version }}
          PLUGIN_CHANGED: ${{ needs.changes.outputs.plugin }}
          MOD_CHANGED: ${{ needs.changes.outputs.mod }}
        with:
          script: |
            const marker = '🚀 **PR Snapshot deployed!**';
            const sections = [];
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts`;

            if (process.env.BUILD_RESULT === 'failure') {
              sections.push(':x: Build failed.');
            } else if (process.env.BUILD_RESULT === 'success') {
              if (process.env.PLUGIN_CHANGED === 'true') {
                sections.push(`### 📦 Plugin\n[plugin-jars](${run}), version \`${process.env.VERSION}\`.`);
              }
              if (process.env.API_PUBLISHED === 'true') {
                sections.push([
                  '### 🧩 API',
                  '```kotlin',
                  `compileOnly("${process.env.API_COORDINATES}:${process.env.VERSION}")`,
                  '```'
                ].join('\n'));
              }
              if (process.env.MOD_CHANGED === 'true') {
                sections.push(`### 🗺️ Mod\n[mod-jars](${run}), version \`${process.env.VERSION}\`.`);
              }
            }

            if (sections.length === 0) {
              console.log('Nothing was deployed, leaving the comment alone.');
              return;
            }

            const body = [
              marker,
              '',
              sections.join('\n\n'),
              '',
              `_Commit: \`${context.payload.pull_request.head.sha.substring(0, 7)}\` · updated ${new Date().toISOString()}_`
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }

  checks:
    name: ✅ Checks
    timeout-minutes: 60
    needs: [ changes, commit-messages, scripts, build, site ]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Collect the results
        uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
          META: >-
            ${{ github.event.action == 'edited'
            || ((github.event.action == 'labeled' || github.event.action == 'unlabeled')
            && github.event.label.name != 'deploy') }}
        with:
          script: |
            const failed = Object.entries(JSON.parse(process.env.NEEDS))
              .filter(([, job]) => job.result === 'failure' || job.result === 'cancelled')
              .map(([name]) => name);
            if (failed.length > 0) {
              core.setFailed(`Failed: ${failed.join(', ')}.`);
              return;
            }
            if (process.env.META !== 'true') {
              return;
            }

            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const {owner, repo} = context.repo;
            for (;;) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'pr.yml',
                head_sha: context.payload.pull_request.head.sha,
                event: 'pull_request',
                per_page: 100
              });
              const runs = data.workflow_runs
                .filter(run => run.id !== context.runId && run.conclusion !== 'cancelled')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              let validation;
              for (const run of runs) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100
                });
                const changes = jobs.find(job => job.name === '🔍 Detect changed parts');
                if (changes && changes.conclusion !== 'skipped') {
                  validation = jobs.find(job => job.name === '✅ Checks');
                  break;
                }
              }
              if (validation?.status === 'completed') {
                if (validation.conclusion !== 'success') {
                  core.setFailed(`The validation of ${sha} concluded ${validation.conclusion}.`);
                }
                return;
              }
              console.log(`Waiting for the validation of ${sha}.`);
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
