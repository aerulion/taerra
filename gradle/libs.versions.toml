google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }

[plugins]
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version = "2.0.0-beta.24" }
plugin-yml-paper = { id = "de.eldoria.plugin-yml.paper", version = "0.9.0" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version = "1.18.2" }
run-paper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
