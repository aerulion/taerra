name: 💬 Notify Discord

on:
  workflow_call:
    inputs:
      title:
        description: The embed title.
        required: true
        type: string
      description:
        description: >-
          The embed text, Markdown. Headings become bold lines, since embeds do not render them, and anything past
          Discord's 4096 characters is cut.
        required: true
        type: string
      url:
        description: Where the title links to.
        required: false
        type: string
      icon:
        description: URL of the avatar and thumbnail image. Left out, Discord shows its default avatar.
        required: false
        type: string
      username:
        description: The name the message is posted under.
        required: false
        type: string
        default: TAERRA
    secrets:
      WEBHOOK_ID:
        description: The webhook ID.
        required: true
      WEBHOOK_TOKEN:
        description: The webhook token.
        required: true

permissions:
  contents: read

jobs:
  notify:
    name: 💬 Post to the webhook
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: 💬 Post to the webhook
        env:
          WEBHOOK_ID: ${{ secrets.WEBHOOK_ID }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          USERNAME: ${{ inputs.username }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
          URL: ${{ inputs.url }}
          ICON: ${{ inputs.icon }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_ID}" ] || [ -z "${WEBHOOK_TOKEN}" ]; then
            echo "::error::The webhook ID and token must both be set."
            exit 1
          fi

          DESCRIPTION="$(sed -E 's/^#{1,6}[[:space:]]+(.*)$/**\1**/' <<< "${DESCRIPTION}")"
          if [ "${#DESCRIPTION}" -gt 4096 ]; then
            DESCRIPTION="${DESCRIPTION:0:4090}"$'\n…'
          fi
          # allowed_mentions stops an @everyone in a commit subject from pinging the whole server.
          payload="$(jq -nc --arg username "${USERNAME}" --arg icon "${ICON}" --arg title "${TITLE}" \
            --arg description "${DESCRIPTION}" --arg url "${URL}" '{
              username: $username,
              allowed_mentions: {parse: []},
              embeds: [{
                title: $title[0:256],
                description: $description,
                color: 5416245
              } + (if $url == "" then {} else {url: $url} end)
                + (if $icon == "" then {} else {thumbnail: {url: $icon}} end)]
            } + (if $icon == "" then {} else {avatar_url: $icon} end)')"

          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-connrefused --max-time 30 \
            --header 'Content-Type: application/json' \
            --user-agent 'Taerra-Release-Pipeline' \
            --data "${payload}" \
            "https://discord.com/api/webhooks/${WEBHOOK_ID}/${WEBHOOK_TOKEN}"

          echo "Notification sent."
