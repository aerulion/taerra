name: Create a GitHub release
description: >-
  Creates as a prerelease, or on a re-run updates, one stream's release, with notes from release-notes.sh. Needs a checkout with
  history and tags.

inputs:
  tag:
    description: The tag to release under. It is created at the commit that triggered the run.
    required: true
  prefix:
    description: The tag prefix identifying this stream. Only releases carrying it count as the previous release.
    required: true
  title:
    description: The release title.
    required: true
  files:
    description: Files to attach, one path or glob per line. A line matching nothing fails the step.
    required: true

runs:
  using: composite
  steps:
    - name: 📦 Create the release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        REPOSITORY: ${{ github.repository }}
        SHA: ${{ github.sha }}
        TAG: ${{ inputs.tag }}
        PREFIX: ${{ inputs.prefix }}
        TITLE: ${{ inputs.title }}
        FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail

        if [ -z "${PREFIX}" ]; then
          echo "::error::Refusing to run without a tag prefix: both streams share one release list."
          exit 1
        fi

        assets=()
        while IFS= read -r pattern; do
          if [ -n "${pattern}" ]; then
            # shellcheck disable=SC2206
            matches=( ${pattern} )
            if [ ! -e "${matches[0]}" ]; then
              echo "::error::No file matches '${pattern}'."
              exit 1
            fi
            assets+=( "${matches[@]}" )
          fi
        done <<< "${FILES}"

        if [ "${#assets[@]}" -eq 0 ]; then
          echo "::error::No files to attach to ${TAG}."
          exit 1
        fi
        echo "Attaching: ${assets[*]}"

        notes="$(mktemp)"
        trap 'rm -f "${notes}"' EXIT
        "${ACTION_PATH}/release-notes.sh" "${PREFIX}" "${TAG}" > "${notes}"
        echo "Release notes:"
        sed 's/^/  /' "${notes}"

        if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
          echo "Release ${TAG} already exists; updating it."
          gh release edit "${TAG}" --repo "${REPOSITORY}" --title "${TITLE}" --notes-file "${notes}"
          gh release upload "${TAG}" --repo "${REPOSITORY}" --clobber "${assets[@]}"
        else
          gh release create "${TAG}" --repo "${REPOSITORY}" \
            --title "${TITLE}" --notes-file "${notes}" --target "${SHA}" --prerelease "${assets[@]}"
        fi
