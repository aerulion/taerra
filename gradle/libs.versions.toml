jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
worldguard-core = { module = "com.sk89q.worldguard:worldguard-core", version.ref = "worldguard" }
worldguard-libs = { module = "com.sk89q.worldguard.worldguard-libs:core", version.ref = "worldguard" }
worldedit-core = { module = "com.sk89q.worldedit:worldedit-core", version.ref = "worldedit" }
worldedit-bukkit = { module = "com.sk89q.worldedit:worldedit-bukkit", version.ref = "worldedit" }
chunky-common = { module = "org.popcraft:chunky-common", version.ref = "chunky" }
chunkyborder-common = { module = "org.popcraft:chunkyborder-common", version.ref = "chunkyborder" }
