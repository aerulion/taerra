name: 🟢 Publish to Modrinth

# Promotes a development build to a Modrinth release: the jar attached to its GitHub release, so what ships is exactly
# what was tested. Plugin and mod are one Modrinth project, told apart by loader. A plugin build's API is rebuilt and
# tested at its tag and published to Maven Central under the same version.
on:
  workflow_dispatch:
    inputs:
      part:
        description: What to publish.
        required: true
        type: choice
        options: [ plugin, mod ]
      build:
        description: The build number, n in its GitHub release plugin-<n> or mod-<n>.
        required: true
        type: number
      channel:
        description: The Modrinth release channel.
        type: choice
        options: [ release, beta, alpha ]
        default: release
      announce:
        description: Announce it on Discord.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: modrinth
  cancel-in-progress: false

jobs:
  publish:
    name: 🟢 Publish to Modrinth
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.publish.outputs.title }}
      url: ${{ steps.publish.outputs.url }}
      description: ${{ steps.publish.outputs.description }}
      icon: ${{ steps.publish.outputs.icon }}
    steps:
      - name: 📥 Checkout the build
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.part }}-${{ inputs.build }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 🟢 Upload the version
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          # The slug the mod, the plugin and the web map link to as well.
          SLUG: taerra
          PART: ${{ inputs.part }}
          BUILD: ${{ inputs.build }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          if [ -z "${MODRINTH_TOKEN}" ]; then
            echo "::error::Set the MODRINTH_TOKEN secret."
            exit 1
          fi

          if [[ ! "${BUILD}" =~ ^[0-9]+$ ]]; then
            echo "::error::'${BUILD}' is not a build number."
            exit 1
          fi
          TAG="${PART}-${BUILD}"
          case "${PART}" in
            plugin) prefix='plugin-' loader='paper' jar='^taerra-paper-build-[0-9]+-[0-9a-f]+\.jar$' part='Paper' ;;
            mod) prefix='mod-' loader='fabric' jar='^taerra-fabric-build-[0-9]+-[0-9a-f]+\.jar$' part='Fabric' ;;
          esac

          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir dist --pattern '*.jar'
          file="$(find dist -maxdepth 1 -name '*.jar' -printf '%f\n' | grep -E "${jar}" | head -n 1 || true)"
          if [ -z "${file}" ]; then
            echo "::error::The ${TAG} release has no ${part} jar."
            exit 1
          fi
          version="${file%.jar}"
          version="${version#*-build-}"
          minecraft="$(sed -nE 's/^minecraft = "([^"]+)"$/\1/p' gradle/libs.versions.toml)"

          modrinth() {
            curl --silent --show-error --fail-with-body --retry 3 --max-time 120 \
              --user-agent "aerulion/taerra release pipeline (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY})" \
              --header "Authorization: ${MODRINTH_TOKEN}" "$@"
          }
          api='https://api.modrinth.com/v2'
          project="$(modrinth "${api}/project/${SLUG}")"
          id="$(jq -r '.id' <<< "${project}")"

          # The notes cover everything since this loader's newest version on Modrinth, whose number ends in its commit.
          previous="$(modrinth --get "${api}/project/${id}/version" --data-urlencode "loaders=[\"${loader}\"]" \
            | jq -r 'max_by(.date_published).version_number // empty')"
          if [ "${previous}" = "${version}" ]; then
            echo "::error::${version} is already the newest ${part} version on Modrinth."
            exit 1
          fi
          if [ -n "${previous}" ] && git cat-file -e "${previous##*-}^{commit}" 2>/dev/null; then
            changelog="$(AUDIENCE=players .github/actions/github-release/release-notes.sh \
              "${prefix}" "${TAG}" "${previous##*-}")"
          else
            changelog='The first release on Modrinth.'
          fi

          dependencies='[]'
          if [ "${loader}" = 'fabric' ]; then
            dependencies="$(jq -nc \
              --arg api "$(modrinth "${api}/project/fabric-api" | jq -r '.id')" \
              --arg menu "$(modrinth "${api}/project/modmenu" | jq -r '.id')" \
              '[{project_id: $api, dependency_type: "required"}, {project_id: $menu, dependency_type: "optional"}]')"
          fi

          name="TAERRA Build ${BUILD} for ${part}"
          jq -n --arg name "${name}" --arg version "${version}" --arg changelog "${changelog}" \
            --argjson dependencies "${dependencies}" --arg minecraft "${minecraft}" --arg channel "${CHANNEL}" \
            --arg loader "${loader}" --arg project "${id}" '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: $dependencies,
              game_versions: [$minecraft],
              version_type: $channel,
              loaders: [$loader],
              featured: ($channel == "release"),
              project_id: $project,
              file_parts: ["file"],
              primary_file: "file"
            }' > data.json
          uploaded="$(modrinth --form 'data=<data.json;type=application/json' --form "file=@dist/${file}" \
            "${api}/version" | jq -r '.id')"
          url="https://modrinth.com/project/${SLUG}/version/${uploaded}"
          echo "Published ${name} (${version}, ${CHANNEL}): ${url}"

          title="${name} is out"
          if [ "${CHANNEL}" != 'release' ]; then
            title="${name} (${CHANNEL})"
          fi
          delimiter="EOF-$(openssl rand -hex 8)"
          {
            echo "title=${title}"
            echo "url=${url}"
            echo "icon=$(jq -r '.icon_url // empty' <<< "${project}")"
            echo "description<<${delimiter}"
            printf '%s\n\n📥 [Download on Modrinth](%s)\n' "${changelog}" "${url}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

  central:
    name: 🏛️ Maven Central
    needs: publish
    if: inputs.part == 'plugin'
    uses: ./.github/workflows/build.yml
    with:
      ref: plugin-${{ inputs.build }}
      build-number: ${{ format('{0}', inputs.build) }}
      central: true
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

  announce:
    name: 💬 Announce on Discord
    needs: publish
    if: inputs.announce
    uses: ./.github/workflows/notify-discord.yml
    with:
      title: ${{ needs.publish.outputs.title }}
      url: ${{ needs.publish.outputs.url }}
      description: ${{ needs.publish.outputs.description }}
      icon: ${{ needs.publish.outputs.icon }}
    secrets:
      WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
      WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
