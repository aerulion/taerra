# TAERRA Configuration
# Every setting can be changed in game with /taerra config <setting> <value>, or on the settings page
# of the web map and the mod by players with taerra.config. Changes apply right away.

# Web server settings
web:
  # Port for the web interface
  port: 8100
  # Bind address (0.0.0.0 for all interfaces, 127.0.0.1 for localhost only)
  host: "0.0.0.0"
  # Address players open the map at, like https://map.example.com, or https://example.com/map when
  # the reverse proxy serves it under a path and passes requests on without it. /taerra login then
  # sends a link that logs the browser in; left empty, the link points at this machine and only
  # works here. Link previews in chat apps also need it to show the map's image.
  public-url: ""
  # The server's name, shown beside TAERRA in the web map's header, as its page title, in link
  # previews, when the map is installed as an app, and in the mod's map screen. Empty shows TAERRA
  # alone; /taerra config web.name "" empties it. Up to 32 letters, digits, spaces and - _ . , : ' & ( ) # ! ? +
  name: ""

# A chat hint a few seconds after joining that links the map (at web.public-url, when set) and the
# mod. Skipped for players who already have the mod, and shown to each player at most once every
# this many days (0 = never).
join-hint:
  interval-days: 7

# Rendering settings
rendering:
  # Number of threads for tile rendering (0 = half the CPU cores, leaving at least two free for the server)
  render-threads: 0
  # How often world changes are rendered, in seconds. Every change is recorded, player edits and natural
  # activity alike, so the map is always brought up to date; it just is not redrawn the moment something moves.
  # A tile changed many times in between is rendered once. 0 = render changes immediately.
  update-interval: 900

# Cache settings. 0 sizes a cache from the server's memory (its -Xmx): about 1.5% of it for tiles
# and 2% for chunks. A set number is capped at 10% of it for tiles and 20% for chunks.
cache:
  # Maximum number of tiles to keep in memory. Most tiles take 256 KB decoded, so 500 tiles is up to ~130 MB
  max-tiles: 0
  # How many chunks of sampled block data to keep in memory for the isometric view, each around 19 KB.
  # A render reads each chunk once per stage when its area fits in here, and more often when it does
  # not: raising it speeds up renders of large areas for the memory it costs.
  max-chunks: 0

# Worlds to render, by dimension key. None by default: enable them in game with
# /taerra config world <world> enable
worlds: [ ]

# Names shown on the map instead of the dimension's own, by dimension key, like
#   minecraft:overworld: Survival
# Set in game with /taerra config world <world> name <name>; the order of the worlds above is the
# order on the map, set with /taerra config world <world> position <number>
world-names: { }

# Worlds only logged-in viewers with taerra.world.<world> see, the colon swapped for a dot:
# minecraft:the_end needs taerra.world.minecraft.the_end. Players log in with /taerra login.
# Set in game with /taerra config world <world> private
private-worlds: [ ]

# Worlds whose players everyone sees listed, with their world, but only logged-in viewers with
# taerra.players.<world> see where: minecraft:overworld needs taerra.players.minecraft.overworld.
# Set in game with /taerra config world <world> players private
private-players: [ ]

# Markers other plugins draw on the map
markers:
  # Layers only logged-in viewers with taerra.layer.<layer> see, like taerra.layer.worldguard.
  # Set in game with /taerra config layer <layer> private
  private-layers: [ chunks, worldguard, griefprevention ]
  # The icon each layer's points show unless they have their own, like
  # - { layer: waypoints.shops, icon: "taerra:shop" }
  # Set in game with /taerra config layer <layer> icon <icon>
  layer-icons: [ ]
  spawn:
    # Mark each world's spawn point on a layer of its own, moved along when the spawn moves
    enabled: true
    # Whether the layer is on for viewers who have not toggled it themselves
    shown-by-default: true
  worldguard:
    # Show WorldGuard regions as a layer viewers can switch on (needs WorldGuard installed). It names
    # each region's owners and members, so it shows who owns and builds on which land. It is in
    # private-layers: only viewers with taerra.layer.worldguard see it
    enabled: false
    # Whether the layer is on for viewers who have not toggled it themselves
    shown-by-default: false
  towny:
    # Show Towny towns as a layer (needs Towny installed), each with its mayor, nation and residents
    enabled: true
    # Whether the layer is on for viewers who have not toggled it themselves
    shown-by-default: true
  griefprevention:
    # Show GriefPrevention claims as a layer (needs GriefPrevention installed). It names each claim's
    # owner and who is trusted there, so it shows where players live. It is in private-layers: only
    # viewers with taerra.layer.griefprevention see it
    enabled: false
    # Whether the layer is on for viewers who have not toggled it themselves
    shown-by-default: false
  plotsquared:
    # Show claimed PlotSquared plots as a layer (needs PlotSquared installed), each with its owners,
    # trusted players and members
    enabled: true
    # Whether the layer is on for viewers who have not toggled it themselves
    shown-by-default: true
  worldborder:
    # Show the vanilla world border and ChunkyBorder borders (if ChunkyBorder is installed) as a layer
    enabled: true
    # Whether the layer is on for viewers who have not toggled it themselves
    shown-by-default: true
  loaded-chunks:
    # Show loaded chunks as a layer, outlined by load level: magenta entity ticking, orange ticking,
    # cyan loaded. It shows where players are, so it is in private-layers: only viewers with
    # taerra.layer.chunks see it
    enabled: false
    # Whether the layer is on for viewers who have not toggled it themselves
    shown-by-default: false
