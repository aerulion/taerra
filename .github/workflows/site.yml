name: 🌐 Website

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: 🌐 Build website
    timeout-minutes: 20
    runs-on: ubuntu-latest
    concurrency:
      group: site-build
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: 🔖 Note the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 🏗️ Check and build the website
        uses: ./.github/actions/build-site

      - name: 📤 Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: 🚀 Deploy website
    timeout-minutes: 10
    needs: build
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 🔖 Move the site tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/site" --silent 2>/dev/null; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/site" -f sha="${COMMIT}" -F force=true --silent
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/tags/site -f sha="${COMMIT}" --silent
          fi
          echo "site now points at ${COMMIT::7}."
