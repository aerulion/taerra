name: Mod bug
description: Something in the Fabric mod's map screen or minimap doesn't work as it should
labels: [ bug, mod, triage ]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting! Questions and setup help go to [Discord](https://discord.taerra.dev) instead, and
        security issues to [contact@taerra.dev](mailto:contact@taerra.dev).

  - type: textarea
    id: debug
    attributes:
      label: Debug info
      description: >-
        Open the map, then **Options...** (or TAERRA in Mod Menu) and click **Report a Bug...**, which fills this in
        and copies it too. It holds versions, your GPU and your mod list, no addresses or player names.
      placeholder: |
        TAERRA debug
        Mod: 410-9f8e7d6, protocol 6
        Minecraft: 26.3
        ...
      render: text
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Map screen
        - Minimap
        - Navigation
        - Login and connection
        - Settings
        - Something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Join the server
        2. Open the map with M
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected

  - type: textarea
    id: log
    attributes:
      label: Game log
      description: Errors or warnings from TAERRA in `logs/latest.log` of your game folder, with the lines around them.
      render: shell

  - type: textarea
    id: more
    attributes:
      label: Screenshots and anything else
      description: Drop images or videos here.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I'm on the newest build from [download.taerra.dev](https://download.taerra.dev)
          required: true
        - label: I searched the existing issues and this isn't one of them
          required: true
